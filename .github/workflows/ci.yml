name: CI

on:
  pull_request:
  push:
    branches: [main, CICD]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage

  frontend:
    runs-on: ubuntu-latest
    env:
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: react-app
      - run: npm run test:coverage
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-coverage
          path: |
            react-app/build
            react-app/coverage

  api-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      DATA_DIR: ./data/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
      - run: npx playwright install --with-deps chromium
      - run: npm start > server.log 2>&1 & echo $! > server.pid
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - run: npm run test:api
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-report
            test-results
            server.log

  sonar:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-and-coverage
          path: .
      - uses: SonarSource/sonarqube-scan-action@v5
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        timeout-minutes: 5
