name: Semzung CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [CICD]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage

  frontend:
    runs-on: ubuntu-latest
    env:
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: react-app
      - run: npm run test:coverage
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-coverage
          path: |
            react-app/build
            react-app/coverage

  api-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      DATA_DIR: ./data/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
      - run: npx playwright install --with-deps chromium
      - run: npm start > server.log 2>&1 & echo $! > server.pid
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - run: npm run test:api
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-report
            test-results
            server.log

  sonar:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build-and-coverage
          path: .
      - uses: SonarSource/sonarqube-scan-action@v7
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        timeout-minutes: 5

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global npm@10.9.2
      - uses: snyk/actions/setup@master
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: snyk test --file=package.json --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: snyk test --file=react-app/package.json --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: snyk code test --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
        env:
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      - run: npm start > server.log 2>&1 &
        env:
          DATA_DIR: ./data/zap
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          fail_action: true
          cmd_options: '-I'
          artifact_name: zap-report
          allow_issue_writing: false

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
        env:
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      - run: npm start > server.log 2>&1 &
        env:
          DATA_DIR: ./data/k6
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/api-load-test.js

  publish-container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, api-and-e2e, sonar, snyk, zap-baseline, performance]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/CICD' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
