name: Security

on:
  pull_request:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: snyk/actions/setup@master
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: snyk test --file=package.json --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: snyk test --file=react-app/package.json --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}
      - run: snyk code test --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
        env:
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      - run: npm start > server.log 2>&1 &
        env:
          DATA_DIR: ./data/zap
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          fail_action: true
          cmd_options: '-I'
          artifact_name: zap-report
