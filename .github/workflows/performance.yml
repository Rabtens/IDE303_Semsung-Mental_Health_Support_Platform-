name: Performance

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci
        working-directory: react-app
      - run: npm run build
        working-directory: react-app
        env:
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: ci-placeholder-key
      - run: npm start > server.log 2>&1 &
        env:
          DATA_DIR: ./data/k6
      - run: npx wait-on http://127.0.0.1:3000/api/health
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/api-load-test.js
